# Replaces the image's default port-80 site, which only redirects to HTTPS on
# 443. This recipe publishes port 80 alone (30360:80), so that redirect sent
# the browser to https://localhost/ and the editor never loaded.
#
# Keep this file free of nginx variables (dollar signs): Sulla Desktop inlines
# it into the compose file, where docker compose would expand them to empty
# strings. The app needs none of them (no websockets; cookies only need the
# request to NOT claim https).
upstream node_app_http {
    server 127.0.0.1:8081;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2G;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
    proxy_connect_timeout 600;

    modsecurity off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\. { deny all; return 403; }
    location ~ /(config|tmp|lang|vendor|node_modules) { deny all; return 403; }
    location ~ \.(sql|yml|ini|zip|sh|log)\z { deny all; return 403; }

    location / {
      proxy_pass http://node_app_http;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Transcription and render progress stream over server-sent events.
      proxy_buffering off;
    }
}
